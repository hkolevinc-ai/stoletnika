name: Stoletnika - Temu from Chrome

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_excel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser export and scraper
        run: |
          if [ ! -f data/stoletnika-browser-export.json.gz ]; then
            echo 'Upload the catalog downloaded from Chrome as data/stoletnika-browser-export.json.gz. Open STOLETNIKA_START.html for instructions.'
            exit 1
          fi
          python -m unittest discover -s tests -q
      - name: Fill Temu template from the browser export
        run: python scrape_stoletnika.py --browser-export data/stoletnika-browser-export.json.gz
      - name: Upload Excel and review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoletnika-temu-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
